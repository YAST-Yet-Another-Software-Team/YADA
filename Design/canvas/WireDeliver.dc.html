<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap");
    body { margin: 0; font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", sans-serif; }
    a { color: oklch(52% 0.205 25); } a:hover { color: oklch(44% 0.18 24); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: oklch(37% 0.011 50); display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1.5px dashed oklch(85% 0.009 50);">
    <div style="width: 26px; height: 26px; border-radius: 999px; border: 1.5px dashed oklch(85% 0.009 50); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 12px; color: oklch(72% 0.011 50);"><</div>
    <div style="font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 20px; color: oklch(37% 0.011 50);">Rider — delivering</div>
  </div>
  <div style="position: relative; height: 380px; background: repeating-linear-gradient(45deg, oklch(96% 0.005 50), oklch(96% 0.005 50) 11px, #ffffff 11px, #ffffff 22px); border-bottom: 1.5px dashed oklch(85% 0.009 50); display: flex; align-items: center; justify-content: center;">
    <div style="font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 16px; color: oklch(72% 0.011 50);">route to the customer</div>
  </div>
  <div style="flex-grow: 1; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px;">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(72% 0.011 50);">Deliver to</div>
      <div style="border: 1.5px dashed oklch(85% 0.009 50); border-radius: 12px; height: 62px; display: flex; align-items: center; padding: 0 14px; font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 15px; color: oklch(37% 0.011 50);">destination + notes</div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <div style="width: 44px; height: 44px; border-radius: 999px; border: 1.5px dashed oklch(85% 0.009 50); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 12px; color: oklch(72% 0.011 50);">pkg</div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 70%; height: 14px; border-radius: 999px; background: oklch(96% 0.005 50);"></div>
      <div style="width: 45%; height: 12px; border-radius: 999px; background: oklch(96% 0.005 50);"></div>
      </div>
      </div>
      <div style="font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 14px; color: oklch(72% 0.011 50);">no price here — the courier is never shown what it is worth</div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <div style="width: 48px; height: 48px; border-radius: 999px; border: 1.5px dashed oklch(85% 0.009 50); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 12px; color: oklch(72% 0.011 50);">call</div>
        <div style="flex-grow: 1; width: 55%; height: 12px; border-radius: 999px; background: oklch(96% 0.005 50);"></div>
      </div>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <div style="border-radius: 16px; height: 54px; display: flex; align-items: center; justify-content: center; font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 17px; border: 1.5px dashed oklch(85% 0.009 50); color: oklch(37% 0.011 50);">Complete delivery</div>
      <div style="font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 14px; color: oklch(72% 0.011 50);">disabled until the rider is within 31 m</div>
      </div>
  </div>
</div>
</x-dc>
</body>
</html>
